<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soho Investment Group Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Soho Investment Group questionnaire, for a Wix "Embed HTML" element.
   Colours: change these to match your Wix section if needed. */
:root {
  --bg: #0c0b0a;
  --panel: #141210;
  --ink: #f3eee6;
  --muted: #a39b8f;
  --line: rgba(243, 238, 230, 0.12);
  --accent: #c9a46a;
  --accent-ink: #0c0b0a;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding: 16px;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

.panel {
  max-width: 720px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
}
.top {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px clamp(20px, 5vw, 44px);
  border-bottom: 1px solid var(--line);
}
.mark {
  display: grid; place-items: center;
  width: 30px; height: 30px; flex-shrink: 0;
  border: 1px solid var(--accent); border-radius: 50%;
  font-family: var(--serif); font-size: 17px; color: var(--accent);
}
.progress { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.6s var(--ease); }
.body { padding: clamp(24px, 5vw, 44px); }
.step { animation: stepIn 0.5s var(--ease); }
@keyframes stepIn { from { opacity: 0; transform: translateX(16px); } }

.eyebrow { margin: 0 0 12px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.count { margin: 0 0 10px; font-size: 13px; color: var(--accent); letter-spacing: 0.1em; }
.question {
  margin: 0 0 24px;
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(28px, 4.5vw, 40px); line-height: 1.08;
}
.options { display: grid; gap: 10px; }
.option {
  display: flex; align-items: center; gap: 14px;
  width: 100%; padding: 15px 18px; text-align: left;
  background: transparent; border: 1px solid var(--line); border-radius: 14px;
  font-size: 15px;
  transition: border-color 0.3s, background 0.3s, transform 0.3s var(--ease);
}
.option:hover { border-color: var(--accent); background: rgba(201, 164, 106, 0.06); transform: translateX(4px); }
.option.is-selected { border-color: var(--accent); background: rgba(201, 164, 106, 0.12); }
.letter {
  flex-shrink: 0; display: grid; place-items: center;
  width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 13px; color: var(--muted);
}
.option.is-selected .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.link {
  margin-top: 20px; padding: 0; border: 0; background: none;
  font-size: 14px; color: var(--muted); transition: color 0.3s;
}
.link:hover { color: var(--ink); }
.option:focus-visible, .link:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.result-title {
  margin: 0 0 12px;
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(34px, 5.5vw, 50px); line-height: 1.02; color: var(--accent);
}
.result-text { margin: 0 0 24px; color: var(--muted); }

.form { display: grid; gap: 14px; padding-top: 24px; border-top: 1px solid var(--line); }
.form__intro { margin: 0; font-weight: 500; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.field input {
  width: 100%; padding: 13px 15px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  color: var(--ink); font: inherit; font-size: 16px; transition: border-color 0.3s;
}
.field input:focus { outline: none; border-color: var(--accent); }
.field input.is-invalid { border-color: #d9776b; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; line-height: 1.55; color: var(--muted); }
.check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
.form__error { margin: 0; font-size: 14px; color: #e08b80; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 100%; padding: 15px 26px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
  font-size: 15px; font-weight: 500;
  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -12px rgba(201, 164, 106, 0.6); }
.btn:disabled { opacity: 0.6; cursor: wait; }
.center { justify-self: center; }

@media (max-width: 560px) {
  body { padding: 8px; }
  .row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="panel">
  <div class="top">
    <span class="mark">S</span>
    <div class="progress" aria-hidden="true"><span class="bar"></span></div>
  </div>

  <div class="body">
    <!-- Questions -->
    <div class="step" data-step="question">
      <p class="count"></p>
      <h2 class="question"></h2>
      <div class="options"></div>
      <button class="link back" type="button">&larr; Back</button>
    </div>

    <!-- Result + details form -->
    <div class="step" data-step="result" hidden>
      <p class="eyebrow">Your match</p>
      <h2 class="result-title"></h2>
      <p class="result-text"></p>

      <form class="form" id="lead-form" novalidate>
        <p class="form__intro">Where should we send your information?</p>
        <div class="row">
          <label class="field"><span>First name</span><input type="text" name="firstName" autocomplete="given-name" required></label>
          <label class="field"><span>Last name</span><input type="text" name="lastName" autocomplete="family-name" required></label>
        </div>
        <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
        <label class="field"><span>Phone</span><input type="tel" name="phone" autocomplete="tel" required></label>
        <label class="check">
          <input type="checkbox" name="consent" required>
          <span>I agree to Soho Investment Group passing my information to the relevant investment. I understand they may contact me by email and phone with information about this investment avenue. I understand these investments are high risk and my capital is at risk.</span>
        </label>
        <p class="form__error" role="alert" hidden></p>
        <button class="btn" type="submit">Send me the information</button>
        <button class="link center restart" type="button">Retake the questionnaire</button>
      </form>
    </div>

    <!-- Thank you -->
    <div class="step" data-step="thanks" hidden>
      <p class="eyebrow">Thank you</p>
      <h2 class="result-title">We'll be in touch.</h2>
      <p class="result-text thanks-text"></p>
      <button class="link restart" type="button">Start again</button>
    </div>
  </div>
</div>

<script>
/* ---------- Settings ----------
   formEndpoint: where completed forms are sent (as JSON, POST),
   for example a Formspree form address or a CRM webhook.
   While it is empty, the thank-you screen still shows but
   the details are not sent anywhere. */
const CONFIG = {
  formEndpoint: "",
};

/* ---------- Investment avenues ---------- */
const AVENUES = {
  pre: {
    title: "Pre-Production Investment",
    text: "You're drawn to the very beginning of a project: development, scripts, casting and planning. Pre-production is where films and series are shaped before a camera turns, and we'll send you information on current opportunities at this stage.",
  },
  production: {
    title: "Production Investment",
    text: "You want to be close to the action. Production covers studios, crews and shoots, where the story is captured on set and on location. We'll send you information on current production opportunities.",
  },
  post: {
    title: "Post-Production Investment",
    text: "You're interested in the craft that turns raw footage into a finished film or series: editing, colour grading, sound and visual effects. We'll send you information on current post-production opportunities.",
  },
  av: {
    title: "Audio Visual Investment",
    text: "Technology and innovation appeal to you. Audio visual centres on home cinemas and the latest screening equipment: premium projection, screens and sound systems that bring the big-screen experience into homes and private venues. We'll send you information on current audio visual opportunities.",
  },
  hmu: {
    title: "Hair and Make-Up Investment",
    text: "You appreciate the specialist talent behind the look of a production: hair, make-up and prosthetics for film and TV. We'll send you information on current hair and make-up opportunities.",
  },
  festival: {
    title: "Film Festival Investment",
    text: "Premieres, screenings and the festival circuit are where films meet audiences, buyers and distributors. We'll send you information on current film festival opportunities.",
  },
};

/* ---------- Questions ----------
   Each answer adds points to one or more avenues.
   The avenue with the most points after five questions is the match. */
const QUESTIONS = [
  {
    q: "Which part of making a film or TV show interests you most?",
    options: [
      { label: "Shaping the idea: scripts, casting and planning", points: { pre: 2 } },
      { label: "Being on set when the cameras roll", points: { production: 2 } },
      { label: "The edit suite: cutting, colour and effects", points: { post: 2 } },
      { label: "The tech: home cinemas and the latest screening equipment", points: { av: 2 } },
      { label: "The look: hair, make-up and prosthetics", points: { hmu: 2 } },
      { label: "Premieres, red carpets and the festival circuit", points: { festival: 2 } },
    ],
  },
  {
    q: "What kind of projects would you most like to be connected to?",
    options: [
      { label: "Independent films heading for festivals", points: { festival: 1, pre: 1 } },
      { label: "High-end drama and streaming series", points: { production: 1, post: 1 } },
      { label: "Period dramas and fantasy with striking looks", points: { hmu: 1, production: 1 } },
      { label: "Immersive viewing: premium sound and big-screen experiences", points: { av: 1, festival: 1 } },
    ],
  },
  {
    q: "At what point would you prefer to get involved?",
    options: [
      { label: "Right at the start, before anything is filmed", points: { pre: 2 } },
      { label: "During filming", points: { production: 1, hmu: 1 } },
      { label: "After filming, as the project is finished", points: { post: 2 } },
      { label: "When it's released and shown to audiences", points: { festival: 2 } },
    ],
  },
  {
    q: "Which of these sounds most appealing to you?",
    options: [
      { label: "Supporting skilled crews and creative talent", points: { hmu: 1, production: 1 } },
      { label: "Backing home cinema and the latest screening technology", points: { av: 2 } },
      { label: "Seeing raw footage become a finished piece", points: { post: 2 } },
      { label: "Being part of industry events and screenings", points: { festival: 2 } },
    ],
  },
  {
    q: "How would you describe your interest in the screen industry?",
    options: [
      { label: "I love the storytelling and the creative process", points: { pre: 1, production: 1 } },
      { label: "I'm fascinated by the craft behind the scenes", points: { hmu: 1, post: 1 } },
      { label: "I'm drawn to innovation and new technology", points: { av: 2 } },
      { label: "I enjoy the glamour and the big occasions", points: { festival: 1, hmu: 1 } },
    ],
  },
];


/* ---------- Elements ---------- */
const bar = document.querySelector(".bar");
const steps = {
  question: document.querySelector('[data-step="question"]'),
  result: document.querySelector('[data-step="result"]'),
  thanks: document.querySelector('[data-step="thanks"]'),
};
const countEl = document.querySelector(".count");
const questionEl = document.querySelector(".question");
const optionsEl = document.querySelector(".options");
const backBtn = document.querySelector(".back");
const form = document.getElementById("lead-form");
const formError = form.querySelector(".form__error");

let current = 0;
let answers = [];
let match = null;

/* ---------- Steps ---------- */
function showStep(name) {
  Object.entries(steps).forEach(([key, el]) => {
    el.hidden = key !== name;
  });
  if (name === "thanks") bar.style.width = "100%";
  window.scrollTo(0, 0);
}

function resetQuiz() {
  current = 0;
  answers = [];
  match = null;
  form.reset();
  formError.hidden = true;
  showStep("question");
  renderQuestion();
}

function renderQuestion() {
  const item = QUESTIONS[current];
  countEl.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  questionEl.textContent = item.q;
  bar.style.width = `${(current / QUESTIONS.length) * 100}%`;
  backBtn.hidden = current === 0;

  optionsEl.innerHTML = "";
  item.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option";
    if (answers[current] === i) btn.classList.add("is-selected");
    btn.innerHTML = `<span class="letter">${String.fromCharCode(65 + i)}</span><span></span>`;
    btn.lastChild.textContent = opt.label;
    btn.addEventListener("click", () => choose(i, btn));
    optionsEl.appendChild(btn);
  });

  steps.question.style.animation = "none";
  void steps.question.offsetWidth;
  steps.question.style.animation = "";
}

function choose(index, btn) {
  answers[current] = index;
  optionsEl.querySelectorAll(".option").forEach((b) => b.classList.remove("is-selected"));
  btn.classList.add("is-selected");
  setTimeout(() => {
    if (current < QUESTIONS.length - 1) {
      current += 1;
      renderQuestion();
    } else {
      showResult();
    }
  }, 260);
}

backBtn.addEventListener("click", () => {
  if (current > 0) {
    current -= 1;
    renderQuestion();
  }
});
document.querySelectorAll(".restart").forEach((b) => b.addEventListener("click", resetQuiz));

/* ---------- Scoring ---------- */
function score() {
  const totals = Object.fromEntries(Object.keys(AVENUES).map((k) => [k, 0]));
  answers.forEach((optIndex, qIndex) => {
    const pts = QUESTIONS[qIndex].options[optIndex].points;
    Object.entries(pts).forEach(([k, v]) => (totals[k] += v));
  });

  const best = Math.max(...Object.values(totals));
  const tied = Object.keys(totals).filter((k) => totals[k] === best);
  if (tied.length === 1) return tied[0];

  // Tie-break: use the most recent answer that points to one of the tied avenues,
  // starting with question 1 (the most direct question).
  for (const qIndex of [0, 4, 3, 2, 1]) {
    const pts = QUESTIONS[qIndex].options[answers[qIndex]].points;
    const hit = tied.find((k) => k in pts);
    if (hit) return hit;
  }
  return tied[0];
}


function showResult() {
  match = score();
  const avenue = AVENUES[match];
  bar.style.width = "100%";
  steps.result.querySelector(".result-title").textContent = avenue.title;
  steps.result.querySelector(".result-text").textContent = avenue.text;
  showStep("result");
}

/* ---------- Form ---------- */
function validate() {
  let ok = true;
  form.querySelectorAll("input[required]").forEach((input) => {
    const valid = input.type === "checkbox" ? input.checked : input.checkValidity() && input.value.trim() !== "";
    input.classList.toggle("is-invalid", !valid);
    if (!valid) ok = false;
  });
  return ok;
}

form.addEventListener("input", (e) => e.target.classList.remove("is-invalid"));

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  formError.hidden = true;

  if (!validate()) {
    formError.textContent = "Please fill in every field and tick the box to continue.";
    formError.hidden = false;
    return;
  }

  const data = Object.fromEntries(new FormData(form).entries());
  let params;
  try { params = new URLSearchParams(window.top.location.search); } catch (_) { params = new URLSearchParams(document.referrer.split("?")[1] || ""); }
  const payload = {
    firstName: data.firstName.trim(),
    lastName: data.lastName.trim(),
    email: data.email.trim(),
    phone: data.phone.trim(),
    consent: true,
    investmentAvenue: AVENUES[match].title,
    answers: answers.map((a, i) => ({
      question: QUESTIONS[i].q,
      answer: QUESTIONS[i].options[a].label,
    })),
    utm_source: params.get("utm_source") || "",
    utm_medium: params.get("utm_medium") || "",
    utm_campaign: params.get("utm_campaign") || "",
    submittedAt: new Date().toISOString(),
  };

  const submitBtn = form.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";

  try {
    if (CONFIG.formEndpoint) {
      const res = await fetch(CONFIG.formEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`Status ${res.status}`);
    } else {
      console.info("No formEndpoint set. Submission:", payload);
    }
    steps.thanks.querySelector(".thanks-text").textContent =
      `Thanks, ${payload.firstName}. We'll send information on ${AVENUES[match].title} to ${payload.email} shortly.`;
    showStep("thanks");
  } catch (err) {
    formError.textContent = "Sorry, something went wrong. Please try again in a moment.";
    formError.hidden = false;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Send me the information";
  }
});


resetQuiz();
</script>
</body>
</html>
